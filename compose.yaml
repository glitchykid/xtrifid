name: xtrifid
services:
  ollama:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    cpus: &runner_cpus "${XTRIFID_RUNNER_CPUS:-4}"
    mem_limit: &runner_memory "${XTRIFID_RUNNER_MEMORY:-6442450944}"
    memswap_limit: *runner_memory
    pids_limit: 256
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_LOAD_TIMEOUT: 2m
      OLLAMA_MAX_TRANSFER_STREAMS: "1"
      GOMAXPROCS: *runner_cpus
    volumes:
      - weights:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 4s
      retries: 20
  studio:
    build:
      context: .
      target: runtime
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_URL: http://ollama:11434
      XTRIFID_RUNNER_MEMORY: *runner_memory
      XTRIFID_RUNNER_CPUS: *runner_cpus
      XTRIFID_MODEL: ${XTRIFID_MODEL:-qwen3.5:4b}
      GDK_BACKEND: x11
      HOME: /tmp
      XTRIFID_FILES: /exports
    volumes:
      - ./exports:/exports
  tests:
    init: true
    profiles: [dev]
    build:
      context: .
      target: test
    environment:
      OLLAMA_URL: http://ollama:11434
      XTRIFID_RUNNER_MEMORY: *runner_memory
      XTRIFID_RUNNER_CPUS: *runner_cpus
      XTRIFID_MODEL: ${XTRIFID_MODEL:-qwen3.5:4b}
volumes:
  weights:
